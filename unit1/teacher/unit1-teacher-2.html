<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 第二回｜運動用品 Let&#x27;s Learn（老師檢討版）</title>
<style>
body{font:18px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;margin:0;background:#f4f5fb;color:#111}
header{position:sticky;top:0;background:#56ab2f;color:#fff;padding:10px 14px;z-index:5}header button{font:inherit;margin:4px 6px 0 0;padding:4px 12px;border-radius:14px;border:0}
main{max-width:900px;margin:0 auto;padding:12px}h2{color:#56ab2f;margin:22px 0 4px}.d{color:#666;margin:0 0 6px}
.q{background:#fff;border-radius:12px;padding:10px 14px;margin:10px 0;box-shadow:0 1px 4px #0001}.o{margin:2px 0 2px 1.2em}
.ans{display:none;margin-top:8px;padding:8px 12px;background:#e8f7ed;border-left:5px solid #2e9e4f;border-radius:6px}.q.sh .ans{display:block}
.scr{display:none;margin-top:6px;padding:8px 12px;background:#fff7e0;border-left:5px solid #f0a500;border-radius:6px}.q.sc .scr{display:block}
.b{font:inherit;font-size:16px;margin:6px 6px 0 0;padding:5px 12px;border-radius:16px;border:2px solid #56ab2f;background:#fff;color:#56ab2f}
.ps{border-left:5px solid #56ab2f;background:#fff;padding:8px 14px;border-radius:6px}img{height:110px;display:block;margin:6px 0}
</style></head><body>
<header><b>Unit 1 · 第二回｜運動用品 Let&#x27;s Learn（老師檢討版）</b><br><button onclick="allv(true)">顯示全部答案</button><button onclick="allv(false)">隱藏全部答案</button><a href="index.html" style="color:#fff;margin-left:10px">回老師選單</a></header>
<main id="m"></main>
<script>
const S=[{"id": "listen", "name": "一、聽力測驗", "desc": "按「🔊 播放」聽句子（可重複聽），選出正確答案。", "type": "mc", "items": [{"audio": "A: What's he going to do? B: He's going to play baseball. He has a bat and a mitt.", "q": "What does he have?", "o": ["a helmet and a skateboard", "a bucket and a fishing rod", "a bat and a mitt", "a tennis ball and a racket"], "a": 2}, {"audio": "I'm going to go fishing. I have a fishing rod and a bucket.", "q": "What is the speaker going to do?", "o": ["go fishing", "play baseball", "play tennis", "go skateboarding"], "a": 0}, {"audio": "A: What are you going to do? B: I'm going to go skateboarding. I have a skateboard and a helmet.", "q": "What does B have?", "o": ["a tent and a flashlight", "a bat and a mitt", "a skateboard and a helmet", "a racket and a ball"], "a": 2}, {"audio": "They're going to play tennis. They have tennis rackets.", "q": "What do they have?", "o": ["buckets", "tennis rackets", "bats", "fishing rods"], "a": 1}, {"audio": "A: Are you going to play tennis with me today? B: No, I'm not. I'm going to play video games with my brother.", "q": "What is B going to do?", "o": ["go skateboarding", "play tennis with A", "go fishing", "play video games"], "a": 3}]}, {"id": "tf", "name": "二、是非題", "desc": "閱讀短文，判斷句子是 True（對）或 False（錯）。", "type": "tf", "passage": "Anna and Ben are going to the park after school. Anna is going to go skateboarding. She has a skateboard and a helmet. Ben is going to play baseball. He has a bat, but he doesn't have a mitt. Anna is going to lend him one.", "items": [{"q": "Anna is going to play baseball.", "a": false}, {"q": "Anna has a helmet.", "a": true}, {"q": "Ben has a bat.", "a": true}, {"q": "Ben has a mitt.", "a": false}, {"q": "They are going to the beach.", "a": false}]}, {"id": "mc", "name": "三、選擇題", "desc": "選出最適合的答案。", "type": "mc", "items": [{"q": "A mitt is for ____.", "o": ["fishing", "tennis", "skateboarding", "baseball"], "a": 3}, {"q": "What's he going to do?  He's going to ____.", "o": ["play baseball", "playing baseball", "go baseball", "plays baseball"], "a": 0}, {"q": "You need a ____ to catch a fish.", "o": ["helmet", "racket", "bat", "fishing rod"], "a": 3}, {"q": "A helmet protects your ____.", "o": ["eye", "foot", "head", "hand"], "a": 2}, {"q": "He ____ a tennis ball and a tennis racket.", "o": ["has", "are", "have", "is"], "a": 0}, {"img": "mitt-hr", "q": "What is this?  這是什麼？", "o": ["a bat", "a mitt", "a bucket", "a helmet"], "a": 1}, {"img": "fishingrod-hr", "q": "What is this?  這是什麼？", "o": ["a skateboard", "a tennis racket", "a fishing rod", "a bat"], "a": 2}]}, {"id": "gram", "name": "四、文法測驗", "desc": "選出文法正確的答案。", "type": "mc", "items": [{"q": "I ____ going to go fishing.", "o": ["am", "be", "is", "are"], "a": 0}, {"q": "What ____ you going to do?", "o": ["am", "does", "are", "is"], "a": 2}, {"q": "He ____ a bat and a mitt.", "o": ["have", "do", "are", "has"], "a": 3}, {"q": "___ you going to play tennis with Gus?", "o": ["Is", "Does", "Are", "Am"], "a": 2}, {"q": "I'm going to go ____ after school.", "o": ["skateboarding", "skateboards", "to skateboard", "skateboard"], "a": 0}]}, {"id": "match", "name": "五、配合題", "desc": "左邊的題目要配右邊哪一個？用下拉選單選出代號。", "type": "match", "opts": ["棒球手套", "安全帽", "釣竿", "球棒", "水桶"], "items": [{"q": "a mitt", "a": 0}, {"q": "a bat", "a": 3}, {"q": "a helmet", "a": 1}, {"q": "a fishing rod", "a": 2}, {"q": "a bucket", "a": 4}]}, {"id": "rewrite", "name": "六、句子改寫", "desc": "依照提示改寫句子，直接輸入完整句子（注意大小寫與標點可忽略）。", "type": "text", "items": [{"h": "改成疑問句", "q": "You are going to play tennis today.", "a": ["Are you going to play tennis today?"]}, {"h": "改成否定句", "q": "I'm going to go skateboarding.", "a": ["I'm not going to go skateboarding.", "I am not going to go skateboarding."]}, {"h": "主詞改成 She", "q": "I have a skateboard and a helmet.", "a": ["She has a skateboard and a helmet."]}, {"h": "改成疑問句", "q": "He has a bat.", "a": ["Does he have a bat?"]}, {"h": "改成否定句", "q": "We're going to play baseball.", "a": ["We're not going to play baseball.", "We are not going to play baseball.", "We aren't going to play baseball."]}]}, {"id": "reorder", "name": "七、句子重組", "desc": "依序點選單字，排成正確的句子。", "type": "order", "items": [{"w": ["going", "What", "are", "you", "to", "do?"], "a": ["What are you going to do?"]}, {"w": ["baseball.", "going", "play", "to", "He's"], "a": ["He's going to play baseball."]}, {"w": ["a", "a", "bat", "has", "He", "and", "mitt."], "a": ["He has a bat and a mitt."]}, {"w": ["fishing.", "I'm", "going", "go", "to"], "a": ["I'm going to go fishing."]}, {"w": ["and", "I", "helmet.", "skateboard", "a", "have", "a"], "a": ["I have a skateboard and a helmet."]}]}];const L='ABCDE';let n=0;const m=document.getElementById('m');const qs=[];
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function allv(v){qs.forEach(q=>q.classList.toggle('sh',v))}
S.forEach(s=>{m.insertAdjacentHTML('beforeend',`<h2>${s.name}</h2><p class="d">${s.desc}</p>`+(s.passage?`<div class="ps">${s.passage}</div>`:'')+(s.type==='match'?'<div class="q">'+s.opts.map((o,k)=>`<div>(${L[k]}) ${o}</div>`).join('')+'</div>':''));
 s.items.forEach(it=>{n++;const d=document.createElement('div');d.className='q';let h=`<b>${n}.</b> `;
  if(s.type==='mc'||s.type==='tf'){h+=it.q;if(it.img)h+=`<img src="img/${it.img}.png" alt="">`;
   if(s.type==='mc')h+=it.o.map((t,k)=>`<div class="o">(${L[k]}) ${t}</div>`).join('');else h+='　（ T ／ F ）';}
  else if(s.type==='match')h+=it.q;
  else if(s.type==='text')h+=`（${it.h}）${it.q}`;
  else h+=it.w.join(' ／ ');
  const a=s.type==='mc'?`(${L[it.a]}) ${it.o[it.a]}`:s.type==='tf'?(it.a?'T（對）':'F（錯）'):s.type==='match'?`(${L[it.a]}) ${s.opts[it.a]}`:it.a.join('　或　');
  d.innerHTML=h+'<div>'+(it.audio?'<button class="b" data-p>🔊 播放</button><button class="b" data-s>顯示聽力稿</button>':'')+'<button class="b" data-a>顯示答案</button></div>'+(it.audio?`<div class="scr">🎧 ${it.audio}</div>`:'')+`<div class="ans">✅ 答案：${a}</div>`;
  d.querySelector('[data-a]').onclick=()=>d.classList.toggle('sh');
  if(it.audio){d.querySelector('[data-p]').onclick=()=>say(it.audio);d.querySelector('[data-s]').onclick=()=>d.classList.toggle('sc')}
  m.appendChild(d);qs.push(d)})});
</script></body></html>
