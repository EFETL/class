<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 第一回｜出遊計畫 Going To（老師檢討版）</title>
<style>
body{font:18px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;margin:0;background:#f4f5fb;color:#111}
header{position:sticky;top:0;background:#667eea;color:#fff;padding:10px 14px;z-index:5}header button{font:inherit;margin:4px 6px 0 0;padding:4px 12px;border-radius:14px;border:0}
main{max-width:900px;margin:0 auto;padding:12px}h2{color:#667eea;margin:22px 0 4px}.d{color:#666;margin:0 0 6px}
.q{background:#fff;border-radius:12px;padding:10px 14px;margin:10px 0;box-shadow:0 1px 4px #0001}.o{margin:2px 0 2px 1.2em}
.ans{display:none;margin-top:8px;padding:8px 12px;background:#e8f7ed;border-left:5px solid #2e9e4f;border-radius:6px}.q.sh .ans{display:block}
.scr{display:none;margin-top:6px;padding:8px 12px;background:#fff7e0;border-left:5px solid #f0a500;border-radius:6px}.q.sc .scr{display:block}
.b{font:inherit;font-size:16px;margin:6px 6px 0 0;padding:5px 12px;border-radius:16px;border:2px solid #667eea;background:#fff;color:#667eea}
.ps{border-left:5px solid #667eea;background:#fff;padding:8px 14px;border-radius:6px}img{height:110px;display:block;margin:6px 0}
</style></head><body>
<header><b>Unit 1 · 第一回｜出遊計畫 Going To（老師檢討版）</b><br><button onclick="allv(true)">顯示全部答案</button><button onclick="allv(false)">隱藏全部答案</button><a href="index.html" style="color:#fff;margin-left:10px">回老師選單</a></header>
<main id="m"></main>
<script>
const S=[{"id": "listen", "name": "一、聽力測驗", "desc": "按「🔊 播放」聽句子（可重複聽），選出正確答案。", "type": "mc", "items": [{"audio": "I'm going to play baseball. I have a bat and a mitt.", "q": "What does the speaker have?", "o": ["a bat and a mitt", "a fishing rod and a bucket", "a tennis racket and a ball", "a skateboard and a helmet"], "a": 0}, {"audio": "A: What are you going to do after school today? B: I'm going to play tennis with Gus.", "q": "What is B going to do?", "o": ["play baseball", "eat pizza", "play tennis", "do homework"], "a": 2}, {"audio": "A: Is it going to rain tomorrow? B: I'm not sure. I hope not.", "q": "What does B think?", "o": ["It will be hot.", "It's going to snow.", "It will rain.", "B doesn't know, and hopes it won't rain."], "a": 3}, {"audio": "She's going to the beach. She needs a towel and sunscreen.", "q": "Where is she going?", "o": ["the park", "the mountains", "the circus", "the beach"], "a": 3}, {"audio": "A: How's the weather going to be tomorrow? B: It's going to be cold.", "q": "How's the weather going to be?", "o": ["cold", "hot", "cool", "foggy"], "a": 0}]}, {"id": "tf", "name": "二、是非題", "desc": "閱讀短文，判斷句子是 True（對）或 False（錯）。", "type": "tf", "passage": "Tom is going to go camping tomorrow. He's really excited. He has a tent and a sleeping bag, but he doesn't have a flashlight. The weather is going to be cool. It isn't going to rain.", "items": [{"q": "Tom is going to go fishing tomorrow.", "a": false}, {"q": "Tom has a tent.", "a": true}, {"q": "Tom has a flashlight.", "a": false}, {"q": "The weather is going to be cool.", "a": true}, {"q": "It's going to rain tomorrow.", "a": false}]}, {"id": "mc", "name": "三、選擇題", "desc": "選出最適合的答案。", "type": "mc", "items": [{"q": "I'm going to go ____. I have a skateboard.", "o": ["skateboard", "play skateboard", "to skateboarding", "skateboarding"], "a": 3}, {"q": "You need a ____ to play tennis.", "o": ["flashlight", "bucket", "fishing rod", "tennis racket"], "a": 3}, {"q": "A: How's the weather going to be?  B: It's going to be ____.", "o": ["Yes, it is.", "cold", "a hat", "skateboarding"], "a": 1}, {"q": "We're going to go camping tomorrow. I'm really ____!", "o": ["excited", "warm", "hot", "cool"], "a": 0}, {"q": "A: Is it going to rain?  B: ____", "o": ["I'm going to go fishing.", "He needs a hat.", "It's a bucket.", "I'm not sure."], "a": 3}, {"img": "towel-r1", "q": "What is this?  這是什麼？", "o": ["a hat", "a tent", "a swimsuit", "a towel"], "a": 3}, {"img": "tent-r1", "q": "What is this?  這是什麼？", "o": ["a tent", "a helmet", "a bucket", "a towel"], "a": 0}]}, {"id": "gram", "name": "四、文法測驗", "desc": "選出文法正確的答案。", "type": "mc", "items": [{"q": "She ____ going to play tennis today.", "o": ["be", "am", "is", "are"], "a": 2}, {"q": "What does she ____?  She needs a hat.", "o": ["to need", "needs", "need", "needing"], "a": 2}, {"q": "They ____ helmets.", "o": ["needs", "needing", "is need", "need"], "a": 3}, {"q": "I'm not going ____ study with Sue.", "o": ["for", "to", "in", "at"], "a": 1}, {"q": "____ he need an umbrella?", "o": ["Is", "Does", "Do", "Are"], "a": 1}]}, {"id": "match", "name": "五、配合題", "desc": "左邊的題目要配右邊哪一個？用下拉選單選出代號。", "type": "match", "opts": ["I'm going to go skateboarding.", "She needs a hat.", "No, he doesn't.", "I hope not.", "It's going to be hot."], "items": [{"q": "What are you going to do?", "a": 0}, {"q": "What does she need?", "a": 1}, {"q": "How's the weather going to be?", "a": 4}, {"q": "Is it going to rain?", "a": 3}, {"q": "Does he need an umbrella?", "a": 2}]}, {"id": "rewrite", "name": "六、句子改寫", "desc": "依照提示改寫句子，直接輸入完整句子（注意大小寫與標點可忽略）。", "type": "text", "items": [{"h": "改成否定句", "q": "I'm going to play tennis with you.", "a": ["I'm not going to play tennis with you."]}, {"h": "改成疑問句", "q": "He is going to play tennis with May today.", "a": ["Is he going to play tennis with May today?"]}, {"h": "主詞改成 He", "q": "I have a bat and a mitt.", "a": ["He has a bat and a mitt."]}, {"h": "主詞改成 They，a hat 改成複數", "q": "She needs a hat.", "a": ["They need hats."]}, {"h": "改成否定句", "q": "He needs an umbrella.", "a": ["He doesn't need an umbrella.", "He does not need an umbrella."]}]}, {"id": "reorder", "name": "七、句子重組", "desc": "依序點選單字，排成正確的句子。", "type": "order", "items": [{"w": ["to", "go", "going", "skateboarding.", "I'm"], "a": ["I'm going to go skateboarding."]}, {"w": ["the", "weather", "going", "to", "be?", "How's"], "a": ["How's the weather going to be?"]}, {"w": ["She", "hat.", "needs", "a"], "a": ["She needs a hat."]}, {"w": ["with", "not", "tennis", "to", "going", "you.", "play", "I'm"], "a": ["I'm not going to play tennis with you."]}, {"w": ["tennis", "Are", "me", "play", "to", "today?", "you", "going", "with"], "a": ["Are you going to play tennis with me today?"]}]}];const L='ABCDE';let n=0;const m=document.getElementById('m');const qs=[];
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function allv(v){qs.forEach(q=>q.classList.toggle('sh',v))}
S.forEach(s=>{m.insertAdjacentHTML('beforeend',`<h2>${s.name}</h2><p class="d">${s.desc}</p>`+(s.passage?`<div class="ps">${s.passage}</div>`:'')+(s.type==='match'?'<div class="q">'+s.opts.map((o,k)=>`<div>(${L[k]}) ${o}</div>`).join('')+'</div>':''));
 s.items.forEach(it=>{n++;const d=document.createElement('div');d.className='q';let h=`<b>${n}.</b> `;
  if(s.type==='mc'||s.type==='tf'){h+=it.q;if(it.img)h+=`<img src="img/${it.img}.png" alt="">`;
   if(s.type==='mc')h+=it.o.map((t,k)=>`<div class="o">(${L[k]}) ${t}</div>`).join('');else h+='　（ T ／ F ）';}
  else if(s.type==='match')h+=it.q;
  else if(s.type==='text')h+=`（${it.h}）${it.q}`;
  else h+=it.w.join(' ／ ');
  const a=s.type==='mc'?`(${L[it.a]}) ${it.o[it.a]}`:s.type==='tf'?(it.a?'T（對）':'F（錯）'):s.type==='match'?`(${L[it.a]}) ${s.opts[it.a]}`:it.a.join('　或　');
  d.innerHTML=h+'<div>'+(it.audio?'<button class="b" data-p>🔊 播放</button><button class="b" data-s>顯示聽力稿</button>':'')+'<button class="b" data-a>顯示答案</button></div>'+(it.audio?`<div class="scr">🎧 ${it.audio}</div>`:'')+`<div class="ans">✅ 答案：${a}</div>`;
  d.querySelector('[data-a]').onclick=()=>d.classList.toggle('sh');
  if(it.audio){d.querySelector('[data-p]').onclick=()=>say(it.audio);d.querySelector('[data-s]').onclick=()=>d.classList.toggle('sc')}
  m.appendChild(d);qs.push(d)})});
</script></body></html>
