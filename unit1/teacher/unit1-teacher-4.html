<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 第四回｜山上與海邊 What Do I Need?（老師檢討版）</title>
<style>
body{font:18px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;margin:0;background:#f4f5fb;color:#111}
header{position:sticky;top:0;background:#e96443;color:#fff;padding:10px 14px;z-index:5}header button{font:inherit;margin:4px 6px 0 0;padding:4px 12px;border-radius:14px;border:0}
main{max-width:900px;margin:0 auto;padding:12px}h2{color:#e96443;margin:22px 0 4px}.d{color:#666;margin:0 0 6px}
.q{background:#fff;border-radius:12px;padding:10px 14px;margin:10px 0;box-shadow:0 1px 4px #0001}.o{margin:2px 0 2px 1.2em}
.ans{display:none;margin-top:8px;padding:8px 12px;background:#e8f7ed;border-left:5px solid #2e9e4f;border-radius:6px}.q.sh .ans{display:block}
.scr{display:none;margin-top:6px;padding:8px 12px;background:#fff7e0;border-left:5px solid #f0a500;border-radius:6px}.q.sc .scr{display:block}
.b{font:inherit;font-size:16px;margin:6px 6px 0 0;padding:5px 12px;border-radius:16px;border:2px solid #e96443;background:#fff;color:#e96443}
.ps{border-left:5px solid #e96443;background:#fff;padding:8px 14px;border-radius:6px}img{height:110px;display:block;margin:6px 0}
</style></head><body>
<header><b>Unit 1 · 第四回｜山上與海邊 What Do I Need?（老師檢討版）</b><br><button onclick="allv(true)">顯示全部答案</button><button onclick="allv(false)">隱藏全部答案</button><a href="index.html" style="color:#fff;margin-left:10px">回老師選單</a></header>
<main id="m"></main>
<script>
const S=[{"id": "listen", "name": "一、聽力測驗", "desc": "按「🔊 播放」聽句子（可重複聽），選出正確答案。", "type": "mc", "items": [{"audio": "A: I'm going to go to the mountains. What do I need? B: You need a flashlight.", "q": "What does A need?", "o": ["a swimsuit", "a flashlight", "a towel", "sunscreen"], "a": 1}, {"audio": "A: I'm going to go to the beach. What do I need? B: You need a towel.", "q": "Where is A going?", "o": ["the circus", "the mountains", "the beach", "school"], "a": 2}, {"audio": "A: What does she need? B: She needs a hat and sunglasses.", "q": "What does she need?", "o": ["a hat and sunglasses", "a tent and a sleeping bag", "a bat and a mitt", "a towel and a swimsuit"], "a": 0}, {"audio": "A: What do they need? B: They need helmets.", "q": "What do they need?", "o": ["helmets", "hats", "towels", "tents"], "a": 0}, {"audio": "A: Does he need an umbrella? B: No, he doesn't. He needs a bag.", "q": "What does he need?", "o": ["a bag", "a towel", "an umbrella", "a hat"], "a": 0}]}, {"id": "tf", "name": "二、是非題", "desc": "閱讀短文，判斷句子是 True（對）或 False（錯）。", "type": "tf", "passage": "Sam is going to go camping in the mountains. He needs a tent, a sleeping bag and a flashlight. Lily is going to go to the beach. She needs a swimsuit, a towel and sunscreen. Lily doesn't need a tent.", "items": [{"q": "Sam is going to the beach.", "a": false}, {"q": "Sam needs a flashlight.", "a": true}, {"q": "Lily needs sunscreen.", "a": true}, {"q": "Lily needs a tent.", "a": false}, {"q": "Sam needs a swimsuit.", "a": false}]}, {"id": "mc", "name": "三、選擇題", "desc": "選出最適合的答案。", "type": "mc", "items": [{"q": "You need a ____ when you go to bed in a tent.", "o": ["sleeping bag", "towel", "bucket", "swimsuit"], "a": 0}, {"q": "You need ____ to protect your eyes from the sun.", "o": ["a flashlight", "a bat", "a tent", "sunglasses"], "a": 3}, {"q": "You put ____ on your skin at the beach.", "o": ["sunscreen", "a racket", "a helmet", "a mitt"], "a": 0}, {"q": "You wear a ____ to swim.", "o": ["tent", "swimsuit", "sleeping bag", "flashlight"], "a": 1}, {"q": "A: I'm going to go to the mountains. What do I need?  B: ____", "o": ["I need a flashlight.", "They need a hat.", "You need a flashlight.", "He needs a towel."], "a": 2}, {"img": "sleepingbag-hr", "q": "What is this?  這是什麼？", "o": ["a tent", "a towel", "a swimsuit", "a sleeping bag"], "a": 3}, {"img": "sunglasses-hr", "q": "What is this?  這是什麼？", "o": ["a hat", "a flashlight", "sunglasses", "sunscreen"], "a": 2}]}, {"id": "gram", "name": "四、文法測驗", "desc": "選出文法正確的答案。", "type": "mc", "items": [{"q": "What does he ____?", "o": ["needs", "need", "needed", "needing"], "a": 1}, {"q": "She ____ a towel.", "o": ["are need", "needing", "need", "needs"], "a": 3}, {"q": "They ____ sunglasses.", "o": ["needs", "needing", "is need", "need"], "a": 3}, {"q": "Does she need a hat? No, she ____.", "o": ["isn't", "aren't", "doesn't", "don't"], "a": 2}, {"q": "I'm going ____ go to the beach.", "o": ["for", "to", "on", "at"], "a": 1}]}, {"id": "match", "name": "五、配合題", "desc": "左邊的題目要配右邊哪一個？用下拉選單選出代號。", "type": "match", "opts": ["毛巾", "太陽眼鏡", "帳篷", "手電筒", "防曬乳"], "items": [{"q": "a towel", "a": 0}, {"q": "a tent", "a": 2}, {"q": "a flashlight", "a": 3}, {"q": "sunglasses", "a": 1}, {"q": "sunscreen", "a": 4}]}, {"id": "rewrite", "name": "六、句子改寫", "desc": "依照提示改寫句子，直接輸入完整句子（注意大小寫與標點可忽略）。", "type": "text", "items": [{"h": "改成疑問句", "q": "He needs an umbrella.", "a": ["Does he need an umbrella?"]}, {"h": "主詞改成 They，a helmet 改成複數", "q": "She needs a helmet.", "a": ["They need helmets."]}, {"h": "改成否定句", "q": "You need a flashlight.", "a": ["You don't need a flashlight.", "You do not need a flashlight."]}, {"h": "改成疑問句", "q": "They need towels.", "a": ["Do they need towels?"]}, {"h": "主詞改成 He", "q": "I need a hat.", "a": ["He needs a hat."]}]}, {"id": "reorder", "name": "七、句子重組", "desc": "依序點選單字，排成正確的句子。", "type": "order", "items": [{"w": ["need?", "What", "I", "do"], "a": ["What do I need?"]}, {"w": ["need", "a", "flashlight.", "You"], "a": ["You need a flashlight."]}, {"w": ["a", "needs", "hat.", "She"], "a": ["She needs a hat."]}, {"w": ["need", "They", "helmets."], "a": ["They need helmets."]}, {"w": ["go", "I'm", "beach.", "to", "to", "going", "the"], "a": ["I'm going to go to the beach."]}]}];const L='ABCDE';let n=0;const m=document.getElementById('m');const qs=[];
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function allv(v){qs.forEach(q=>q.classList.toggle('sh',v))}
S.forEach(s=>{m.insertAdjacentHTML('beforeend',`<h2>${s.name}</h2><p class="d">${s.desc}</p>`+(s.passage?`<div class="ps">${s.passage}</div>`:'')+(s.type==='match'?'<div class="q">'+s.opts.map((o,k)=>`<div>(${L[k]}) ${o}</div>`).join('')+'</div>':''));
 s.items.forEach(it=>{n++;const d=document.createElement('div');d.className='q';let h=`<b>${n}.</b> `;
  if(s.type==='mc'||s.type==='tf'){h+=it.q;if(it.img)h+=`<img src="img/${it.img}.png" alt="">`;
   if(s.type==='mc')h+=it.o.map((t,k)=>`<div class="o">(${L[k]}) ${t}</div>`).join('');else h+='　（ T ／ F ）';}
  else if(s.type==='match')h+=it.q;
  else if(s.type==='text')h+=`（${it.h}）${it.q}`;
  else h+=it.w.join(' ／ ');
  const a=s.type==='mc'?`(${L[it.a]}) ${it.o[it.a]}`:s.type==='tf'?(it.a?'T（對）':'F（錯）'):s.type==='match'?`(${L[it.a]}) ${s.opts[it.a]}`:it.a.join('　或　');
  d.innerHTML=h+'<div>'+(it.audio?'<button class="b" data-p>🔊 播放</button><button class="b" data-s>顯示聽力稿</button>':'')+'<button class="b" data-a>顯示答案</button></div>'+(it.audio?`<div class="scr">🎧 ${it.audio}</div>`:'')+`<div class="ans">✅ 答案：${a}</div>`;
  d.querySelector('[data-a]').onclick=()=>d.classList.toggle('sh');
  if(it.audio){d.querySelector('[data-p]').onclick=()=>say(it.audio);d.querySelector('[data-s]').onclick=()=>d.classList.toggle('sc')}
  m.appendChild(d);qs.push(d)})});
</script></body></html>
