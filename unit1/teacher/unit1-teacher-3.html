<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 第三回｜天氣 Let&#x27;s Talk（老師檢討版）</title>
<style>
body{font:18px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;margin:0;background:#f4f5fb;color:#111}
header{position:sticky;top:0;background:#f7971e;color:#fff;padding:10px 14px;z-index:5}header button{font:inherit;margin:4px 6px 0 0;padding:4px 12px;border-radius:14px;border:0}
main{max-width:900px;margin:0 auto;padding:12px}h2{color:#f7971e;margin:22px 0 4px}.d{color:#666;margin:0 0 6px}
.q{background:#fff;border-radius:12px;padding:10px 14px;margin:10px 0;box-shadow:0 1px 4px #0001}.o{margin:2px 0 2px 1.2em}
.ans{display:none;margin-top:8px;padding:8px 12px;background:#e8f7ed;border-left:5px solid #2e9e4f;border-radius:6px}.q.sh .ans{display:block}
.scr{display:none;margin-top:6px;padding:8px 12px;background:#fff7e0;border-left:5px solid #f0a500;border-radius:6px}.q.sc .scr{display:block}
.b{font:inherit;font-size:16px;margin:6px 6px 0 0;padding:5px 12px;border-radius:16px;border:2px solid #f7971e;background:#fff;color:#f7971e}
.ps{border-left:5px solid #f7971e;background:#fff;padding:8px 14px;border-radius:6px}img{height:110px;display:block;margin:6px 0}
</style></head><body>
<header><b>Unit 1 · 第三回｜天氣 Let&#x27;s Talk（老師檢討版）</b><br><button onclick="allv(true)">顯示全部答案</button><button onclick="allv(false)">隱藏全部答案</button><a href="index.html" style="color:#fff;margin-left:10px">回老師選單</a></header>
<main id="m"></main>
<script>
const S=[{"id": "listen", "name": "一、聽力測驗", "desc": "按「🔊 播放」聽句子（可重複聽），選出正確答案。", "type": "mc", "items": [{"audio": "A: How's the weather going to be? B: It's going to be hot.", "q": "How's the weather going to be?", "o": ["foggy", "cold", "hot", "cool"], "a": 2}, {"audio": "A: We're going to go camping tomorrow. I'm really excited! B: Me, too!", "q": "How do they feel?", "o": ["excited", "sad", "tired", "angry"], "a": 0}, {"audio": "A: Is it going to rain? B: I'm not sure.", "q": "What does B say?", "o": ["Yes, it is.", "B doesn't know.", "B hopes so.", "No, it isn't."], "a": 1}, {"audio": "The newspaper says it's going to snow tomorrow. Do you think we need our umbrellas?", "q": "What does the newspaper say?", "o": ["It's going to be warm.", "It's going to snow.", "It's going to be hot.", "It's going to be foggy."], "a": 1}, {"audio": "A: Is it going to be cold tomorrow? B: Yes, it is. It's going to be very cold.", "q": "Is tomorrow going to be cold?", "o": ["No, it's going to be hot.", "No, it's going to be warm.", "Yes, it is.", "B doesn't know."], "a": 2}]}, {"id": "tf", "name": "二、是非題", "desc": "閱讀短文，判斷句子是 True（對）或 False（錯）。", "type": "tf", "passage": "Mia is talking with her friend on the phone. They are going to go camping tomorrow. Mia is really excited. Her friend asks, \"How's the weather going to be?\" Mia says, \"It's going to be cold.\" Her friend asks, \"Is it going to rain?\" Mia says, \"I'm not sure. I hope not.\"", "items": [{"q": "Mia and her friend are going to go camping.", "a": true}, {"q": "Mia is not excited.", "a": false}, {"q": "The weather is going to be cold.", "a": true}, {"q": "Mia is sure it is going to rain.", "a": false}, {"q": "They are talking face to face.", "a": false}]}, {"id": "mc", "name": "三、選擇題", "desc": "選出最適合的答案。", "type": "mc", "items": [{"q": "How's the weather going to be tomorrow?  ____", "o": ["Yes, I am.", "He needs a helmet.", "I'm going to go fishing.", "It's going to be foggy."], "a": 3}, {"q": "The weather is hot and dry. It is NOT ____.", "o": ["humid", "sunny", "hot", "warm"], "a": 0}, {"q": "It's snowing outside. It's very ____.", "o": ["humid", "hot", "warm", "cold"], "a": 3}, {"q": "I don't know. = I'm ____.", "o": ["excited", "foggy", "not sure", "cold"], "a": 2}, {"q": "A: Is it going to rain?  B: I ____ not.", "o": ["am hope", "hopes", "hope", "hoping"], "a": 2}, {"img": "cold-hr", "q": "How is the weather in the picture?  圖中天氣如何？", "o": ["warm", "cold", "foggy", "hot"], "a": 1}, {"img": "foggy-hr", "q": "How is the weather in the picture?  圖中天氣如何？", "o": ["cool", "humid", "foggy", "hot"], "a": 2}]}, {"id": "gram", "name": "四、文法測驗", "desc": "選出文法正確的答案。", "type": "mc", "items": [{"q": "How's the weather ____ to be tomorrow?", "o": ["go", "is going", "goes", "going"], "a": 3}, {"q": "It's going ____ be cool.", "o": ["for", "in", "at", "to"], "a": 3}, {"q": "____ it going to rain tomorrow?", "o": ["Does", "Do", "Are", "Is"], "a": 3}, {"q": "We ____ going to go camping tomorrow.", "o": ["am", "be", "is", "are"], "a": 3}, {"q": "It ____ going to snow.", "o": ["am not", "isn't", "don't", "aren't"], "a": 1}]}, {"id": "match", "name": "五、配合題", "desc": "左邊的題目要配右邊哪一個？用下拉選單選出代號。", "type": "match", "opts": ["有霧的", "寒冷的", "溫暖的", "潮濕的", "涼爽的"], "items": [{"q": "cool", "a": 4}, {"q": "cold", "a": 1}, {"q": "humid", "a": 3}, {"q": "foggy", "a": 0}, {"q": "warm", "a": 2}]}, {"id": "rewrite", "name": "六、句子改寫", "desc": "依照提示改寫句子，直接輸入完整句子（注意大小寫與標點可忽略）。", "type": "text", "items": [{"h": "改成疑問句", "q": "It is going to rain tomorrow.", "a": ["Is it going to rain tomorrow?"]}, {"h": "改成否定句", "q": "It's going to be cold.", "a": ["It's not going to be cold.", "It isn't going to be cold.", "It is not going to be cold."]}, {"h": "改成疑問句", "q": "The weather is going to be hot.", "a": ["Is the weather going to be hot?"]}, {"h": "改成否定句", "q": "We're going to go camping.", "a": ["We're not going to go camping.", "We are not going to go camping.", "We aren't going to go camping."]}, {"h": "用 tomorrow 改成未來式", "q": "It is foggy today.", "a": ["It is going to be foggy tomorrow.", "It's going to be foggy tomorrow."]}]}, {"id": "reorder", "name": "七、句子重組", "desc": "依序點選單字，排成正確的句子。", "type": "order", "items": [{"w": ["going", "to", "cold.", "It's", "be"], "a": ["It's going to be cold."]}, {"w": ["going", "it", "to", "rain?", "Is"], "a": ["Is it going to rain?"]}, {"w": ["hope", "I", "not."], "a": ["I hope not."]}, {"w": ["camping", "We're", "going", "tomorrow.", "to", "go"], "a": ["We're going to go camping tomorrow."]}, {"w": ["the", "weather", "going", "How's", "tomorrow?", "be", "to"], "a": ["How's the weather going to be tomorrow?"]}]}];const L='ABCDE';let n=0;const m=document.getElementById('m');const qs=[];
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function allv(v){qs.forEach(q=>q.classList.toggle('sh',v))}
S.forEach(s=>{m.insertAdjacentHTML('beforeend',`<h2>${s.name}</h2><p class="d">${s.desc}</p>`+(s.passage?`<div class="ps">${s.passage}</div>`:'')+(s.type==='match'?'<div class="q">'+s.opts.map((o,k)=>`<div>(${L[k]}) ${o}</div>`).join('')+'</div>':''));
 s.items.forEach(it=>{n++;const d=document.createElement('div');d.className='q';let h=`<b>${n}.</b> `;
  if(s.type==='mc'||s.type==='tf'){h+=it.q;if(it.img)h+=`<img src="img/${it.img}.png" alt="">`;
   if(s.type==='mc')h+=it.o.map((t,k)=>`<div class="o">(${L[k]}) ${t}</div>`).join('');else h+='　（ T ／ F ）';}
  else if(s.type==='match')h+=it.q;
  else if(s.type==='text')h+=`（${it.h}）${it.q}`;
  else h+=it.w.join(' ／ ');
  const a=s.type==='mc'?`(${L[it.a]}) ${it.o[it.a]}`:s.type==='tf'?(it.a?'T（對）':'F（錯）'):s.type==='match'?`(${L[it.a]}) ${s.opts[it.a]}`:it.a.join('　或　');
  d.innerHTML=h+'<div>'+(it.audio?'<button class="b" data-p>🔊 播放</button><button class="b" data-s>顯示聽力稿</button>':'')+'<button class="b" data-a>顯示答案</button></div>'+(it.audio?`<div class="scr">🎧 ${it.audio}</div>`:'')+`<div class="ans">✅ 答案：${a}</div>`;
  d.querySelector('[data-a]').onclick=()=>d.classList.toggle('sh');
  if(it.audio){d.querySelector('[data-p]').onclick=()=>say(it.audio);d.querySelector('[data-s]').onclick=()=>d.classList.toggle('sc')}
  m.appendChild(d);qs.push(d)})});
</script></body></html>
