<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 第五回｜綜合複習 After School（老師檢討版）</title>
<style>
body{font:18px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;margin:0;background:#f4f5fb;color:#111}
header{position:sticky;top:0;background:#8e44ad;color:#fff;padding:10px 14px;z-index:5}header button{font:inherit;margin:4px 6px 0 0;padding:4px 12px;border-radius:14px;border:0}
main{max-width:900px;margin:0 auto;padding:12px}h2{color:#8e44ad;margin:22px 0 4px}.d{color:#666;margin:0 0 6px}
.q{background:#fff;border-radius:12px;padding:10px 14px;margin:10px 0;box-shadow:0 1px 4px #0001}.o{margin:2px 0 2px 1.2em}
.ans{display:none;margin-top:8px;padding:8px 12px;background:#e8f7ed;border-left:5px solid #2e9e4f;border-radius:6px}.q.sh .ans{display:block}
.scr{display:none;margin-top:6px;padding:8px 12px;background:#fff7e0;border-left:5px solid #f0a500;border-radius:6px}.q.sc .scr{display:block}
.b{font:inherit;font-size:16px;margin:6px 6px 0 0;padding:5px 12px;border-radius:16px;border:2px solid #8e44ad;background:#fff;color:#8e44ad}
.ps{border-left:5px solid #8e44ad;background:#fff;padding:8px 14px;border-radius:6px}img{height:110px;display:block;margin:6px 0}
</style></head><body>
<header><b>Unit 1 · 第五回｜綜合複習 After School（老師檢討版）</b><br><button onclick="allv(true)">顯示全部答案</button><button onclick="allv(false)">隱藏全部答案</button><a href="index.html" style="color:#fff;margin-left:10px">回老師選單</a></header>
<main id="m"></main>
<script>
const S=[{"id": "listen", "name": "一、聽力測驗", "desc": "按「🔊 播放」聽句子（可重複聽），選出正確答案。", "type": "mc", "items": [{"audio": "A: What are you going to do after school today? B: I'm going to eat pizza with you.", "q": "What is B going to do?", "o": ["eat pizza with A", "go fishing", "play tennis", "do homework"], "a": 0}, {"audio": "A: Are you going to do your homework with Sue today? B: No, I'm not. I'm not going to do my homework today.", "q": "Is B going to do homework?", "o": ["B is doing it now.", "Yes, B is.", "B doesn't know.", "No, B isn't."], "a": 3}, {"audio": "Gus is going to play tennis. He has a tennis ball and a tennis racket.", "q": "What does Gus have?", "o": ["a bat and a mitt", "a skateboard", "a tennis ball and a tennis racket", "a bucket"], "a": 2}, {"audio": "A: Do you think we need our umbrellas? B: Ask the weatherman. I don't know.", "q": "What does B say?", "o": ["B needs an umbrella.", "B doesn't know.", "B knows.", "B hopes it rains."], "a": 1}, {"audio": "A: Is he going to play tennis with May today? B: Yes, he is. He has a tennis racket.", "q": "Who is he going to play with?", "o": ["his brother", "Gus", "Sue", "May"], "a": 3}]}, {"id": "tf", "name": "二、是非題", "desc": "閱讀短文，判斷句子是 True（對）或 False（錯）。", "type": "tf", "passage": "Today after school, Gus is going to play tennis with May. He has a tennis racket and a tennis ball. Sue isn't going to play tennis. She is going to do her homework. The weather is going to be warm, so nobody needs an umbrella.", "items": [{"q": "Gus is going to play tennis with Sue.", "a": false}, {"q": "Gus has a racket.", "a": true}, {"q": "Sue is going to do her homework.", "a": true}, {"q": "The weather is going to be cold.", "a": false}, {"q": "Everybody needs an umbrella.", "a": false}]}, {"id": "mc", "name": "三、選擇題", "desc": "選出最適合的答案。", "type": "mc", "items": [{"q": "A: Are you going to play tennis with Gus?  B: ____", "o": ["No, I don't.", "Yes, I do.", "Yes, he does.", "No, I'm not."], "a": 3}, {"q": "I'm going to eat pizza ____ you.", "o": ["with", "for", "on", "at"], "a": 0}, {"q": "A: What are you going to do after school?  B: I'm going to ____ my homework.", "o": ["eat", "go", "play", "do"], "a": 3}, {"q": "Ask the ____. He knows the weather.", "o": ["mitt", "weatherman", "helmet", "bucket"], "a": 1}, {"q": "The ____ says it's going to snow.", "o": ["towel", "racket", "newspaper", "tent"], "a": 2}, {"img": "racket-hr", "q": "What is this?  這是什麼？", "o": ["a fishing rod", "a bat", "a bucket", "a tennis racket"], "a": 3}, {"img": "bucket-hr", "q": "What is this?  這是什麼？", "o": ["a helmet", "a bucket", "a tennis ball", "a mitt"], "a": 1}]}, {"id": "gram", "name": "四、文法測驗", "desc": "選出文法正確的答案。", "type": "mc", "items": [{"q": "____ you going to play tennis with me today?", "o": ["Do", "Am", "Are", "Is"], "a": 2}, {"q": "I'm not going to study ____ Sue.", "o": ["with", "for", "of", "at"], "a": 0}, {"q": "Gus ____ a tennis racket.", "o": ["has", "is", "have", "are"], "a": 0}, {"q": "She is going to ____ her homework.", "o": ["does", "did", "do", "doing"], "a": 2}, {"q": "They ____ going to play baseball.", "o": ["is", "are", "be", "am"], "a": 1}]}, {"id": "match", "name": "五、配合題", "desc": "左邊的題目要配右邊哪一個？用下拉選單選出代號。", "type": "match", "opts": ["Yes, he does.", "I'm going to eat pizza.", "No, I'm not.", "It's going to snow.", "I don't know."], "items": [{"q": "Are you going to play tennis with Gus?", "a": 2}, {"q": "What are you going to do after school?", "a": 1}, {"q": "Do you think we need our umbrellas?", "a": 4}, {"q": "Does he need a helmet?", "a": 0}, {"q": "How's the weather going to be?", "a": 3}]}, {"id": "rewrite", "name": "六、句子改寫", "desc": "依照提示改寫句子，直接輸入完整句子（注意大小寫與標點可忽略）。", "type": "text", "items": [{"h": "改成疑問句", "q": "You are going to eat pizza with me.", "a": ["Are you going to eat pizza with me?"]}, {"h": "改成否定句", "q": "I'm going to do my homework today.", "a": ["I'm not going to do my homework today.", "I am not going to do my homework today."]}, {"h": "主詞改成 She", "q": "I have a tennis racket.", "a": ["She has a tennis racket."]}, {"h": "改成疑問句", "q": "He is going to play tennis with May.", "a": ["Is he going to play tennis with May?"]}, {"h": "改成否定句", "q": "She needs a helmet.", "a": ["She doesn't need a helmet.", "She does not need a helmet."]}]}, {"id": "reorder", "name": "七、句子重組", "desc": "依序點選單字，排成正確的句子。", "type": "order", "items": [{"w": ["What", "to", "school", "are", "today?", "going", "you", "after", "do"], "a": ["What are you going to do after school today?"]}, {"w": ["going", "to", "pizza", "you.", "I'm", "with", "eat"], "a": ["I'm going to eat pizza with you."]}, {"w": ["play", "going", "he", "May", "today?", "to", "Is", "tennis", "with"], "a": ["Is he going to play tennis with May today?"]}, {"w": ["a", "He", "racket.", "has", "tennis"], "a": ["He has a tennis racket."]}, {"w": ["brother.", "play", "video", "my", "I'm", "with", "going", "to", "games"], "a": ["I'm going to play video games with my brother."]}]}];const L='ABCDE';let n=0;const m=document.getElementById('m');const qs=[];
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function allv(v){qs.forEach(q=>q.classList.toggle('sh',v))}
S.forEach(s=>{m.insertAdjacentHTML('beforeend',`<h2>${s.name}</h2><p class="d">${s.desc}</p>`+(s.passage?`<div class="ps">${s.passage}</div>`:'')+(s.type==='match'?'<div class="q">'+s.opts.map((o,k)=>`<div>(${L[k]}) ${o}</div>`).join('')+'</div>':''));
 s.items.forEach(it=>{n++;const d=document.createElement('div');d.className='q';let h=`<b>${n}.</b> `;
  if(s.type==='mc'||s.type==='tf'){h+=it.q;if(it.img)h+=`<img src="img/${it.img}.png" alt="">`;
   if(s.type==='mc')h+=it.o.map((t,k)=>`<div class="o">(${L[k]}) ${t}</div>`).join('');else h+='　（ T ／ F ）';}
  else if(s.type==='match')h+=it.q;
  else if(s.type==='text')h+=`（${it.h}）${it.q}`;
  else h+=it.w.join(' ／ ');
  const a=s.type==='mc'?`(${L[it.a]}) ${it.o[it.a]}`:s.type==='tf'?(it.a?'T（對）':'F（錯）'):s.type==='match'?`(${L[it.a]}) ${s.opts[it.a]}`:it.a.join('　或　');
  d.innerHTML=h+'<div>'+(it.audio?'<button class="b" data-p>🔊 播放</button><button class="b" data-s>顯示聽力稿</button>':'')+'<button class="b" data-a>顯示答案</button></div>'+(it.audio?`<div class="scr">🎧 ${it.audio}</div>`:'')+`<div class="ans">✅ 答案：${a}</div>`;
  d.querySelector('[data-a]').onclick=()=>d.classList.toggle('sh');
  if(it.audio){d.querySelector('[data-p]').onclick=()=>say(it.audio);d.querySelector('[data-s]').onclick=()=>d.classList.toggle('sc')}
  m.appendChild(d);qs.push(d)})});
</script></body></html>
