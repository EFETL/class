<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 1 The Great Outdoors — 第二回｜運動用品 Let's Learn</title>
<style>
:root{--c:#56ab2f}
*{box-sizing:border-box}body{margin:0;font:17px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f4f5fb;color:#222}
header{position:sticky;top:0;z-index:5;background:var(--c);color:#fff;padding:10px 14px}
header b{font-size:17px}#bar{height:6px;background:rgba(255,255,255,.35);border-radius:3px;margin-top:6px}#fill{height:100%;width:0;background:#fff;border-radius:3px;transition:width .2s}
main{max-width:760px;margin:0 auto;padding:12px}
h2{font-size:19px;margin:22px 0 4px;color:var(--c)}.desc{color:#666;font-size:16px;margin:0 0 8px}
.q{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 4px #0001}
.passage{border-left:5px solid var(--c);background:#fff;padding:10px 14px;border-radius:6px;font-size:17px}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:2px solid #ddd;border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer}
.opt.ok{border-color:#2e9e4f;background:#e8f7ed}.opt.bad{border-color:#d33;background:#fdecec}
.play{font:inherit;background:var(--c);color:#fff;border:0;border-radius:20px;padding:8px 16px;margin-bottom:6px}
select,input[type=text]{font:inherit;padding:8px;border:2px solid #ddd;border-radius:8px;width:100%;margin-top:6px}
.chip{display:inline-block;font:inherit;border:2px solid var(--c);background:#fff;color:var(--c);border-radius:18px;padding:5px 12px;margin:4px 4px 0 0}
.chip.used{opacity:.3}.ans{min-height:44px;border-bottom:2px dashed #aaa;margin:6px 0;padding:4px 0}
.small{font:inherit;border:1px solid #bbb;background:#f6f6f6;border-radius:8px;padding:6px 12px;margin-right:6px}
.fb{margin-top:6px;font-size:16px}.fb.ok{color:#2e9e4f}.fb.bad{color:#d33}
#submit{display:block;margin:24px auto;font:inherit;font-weight:700;background:var(--c);color:#fff;border:0;border-radius:28px;padding:14px 30px}
#ov{display:none;position:fixed;inset:0;background:#000a;z-index:9;align-items:center;justify-content:center}
#ov div{background:#fff;border-radius:16px;padding:26px;text-align:center;max-width:320px}#ov .s{font-size:48px;color:var(--c);font-weight:800}
a.back{color:#fff;font-size:16px;float:right}
</style></head><body>
<header><a class="back" href="index.html">回選單</a><b>Unit 1 · 第二回｜運動用品 Let's Learn</b><div id="stat" style="font-size:16px"></div><div id="bar"><div id="fill"></div></div></header>
<main id="m"></main>
<button id="submit">📝 交卷 / 查看成績</button>
<div id="ov"><div><div>你的成績</div><div class="s" id="sc"></div><p id="gl"></p><button class="small" onclick="location.reload()">重新作答</button> <button class="small" onclick="document.getElementById('ov').style.display='none'">看解答</button></div></div>
<script>
const S=[{"id": "listen", "name": "一、聽力測驗", "desc": "按「🔊 播放」聽句子（可重複聽），選出正確答案。", "type": "mc", "items": [{"audio": "A: What's he going to do? B: He's going to play baseball. He has a bat and a mitt.", "q": "What does he have?", "o": ["a helmet and a skateboard", "a bucket and a fishing rod", "a bat and a mitt", "a tennis ball and a racket"], "a": 2}, {"audio": "I'm going to go fishing. I have a fishing rod and a bucket.", "q": "What is the speaker going to do?", "o": ["go fishing", "play baseball", "play tennis", "go skateboarding"], "a": 0}, {"audio": "A: What are you going to do? B: I'm going to go skateboarding. I have a skateboard and a helmet.", "q": "What does B have?", "o": ["a tent and a flashlight", "a bat and a mitt", "a skateboard and a helmet", "a racket and a ball"], "a": 2}, {"audio": "They're going to play tennis. They have tennis rackets.", "q": "What do they have?", "o": ["buckets", "tennis rackets", "bats", "fishing rods"], "a": 1}, {"audio": "A: Are you going to play tennis with me today? B: No, I'm not. I'm going to play video games with my brother.", "q": "What is B going to do?", "o": ["go skateboarding", "play tennis with A", "go fishing", "play video games"], "a": 3}]}, {"id": "tf", "name": "二、是非題", "desc": "閱讀短文，判斷句子是 True（對）或 False（錯）。", "type": "tf", "passage": "Anna and Ben are going to the park after school. Anna is going to go skateboarding. She has a skateboard and a helmet. Ben is going to play baseball. He has a bat, but he doesn't have a mitt. Anna is going to lend him one.", "items": [{"q": "Anna is going to play baseball.", "a": false}, {"q": "Anna has a helmet.", "a": true}, {"q": "Ben has a bat.", "a": true}, {"q": "Ben has a mitt.", "a": false}, {"q": "They are going to the beach.", "a": false}]}, {"id": "mc", "name": "三、選擇題", "desc": "選出最適合的答案。", "type": "mc", "items": [{"q": "A mitt is for ____.", "o": ["fishing", "tennis", "skateboarding", "baseball"], "a": 3}, {"q": "What's he going to do?  He's going to ____.", "o": ["play baseball", "playing baseball", "go baseball", "plays baseball"], "a": 0}, {"q": "You need a ____ to catch a fish.", "o": ["helmet", "racket", "bat", "fishing rod"], "a": 3}, {"q": "A helmet protects your ____.", "o": ["eye", "foot", "head", "hand"], "a": 2}, {"q": "He ____ a tennis ball and a tennis racket.", "o": ["has", "are", "have", "is"], "a": 0}]}, {"id": "gram", "name": "四、文法測驗", "desc": "選出文法正確的答案。", "type": "mc", "items": [{"q": "I ____ going to go fishing.", "o": ["am", "is", "be", "are"], "a": 0}, {"q": "What ____ you going to do?", "o": ["does", "am", "is", "are"], "a": 3}, {"q": "He ____ a bat and a mitt.", "o": ["has", "do", "have", "are"], "a": 0}, {"q": "___ you going to play tennis with Gus?", "o": ["Am", "Does", "Are", "Is"], "a": 2}, {"q": "I'm going to go ____ after school.", "o": ["skateboarding", "skateboards", "to skateboard", "skateboard"], "a": 0}]}, {"id": "match", "name": "五、配合題", "desc": "左邊的題目要配右邊哪一個？用下拉選單選出代號。", "type": "match", "opts": ["水桶", "棒球手套", "釣竿", "安全帽", "球棒"], "items": [{"q": "a mitt", "a": 1}, {"q": "a bat", "a": 4}, {"q": "a helmet", "a": 3}, {"q": "a fishing rod", "a": 2}, {"q": "a bucket", "a": 0}]}, {"id": "rewrite", "name": "六、句子改寫", "desc": "依照提示改寫句子，直接輸入完整句子（注意大小寫與標點可忽略）。", "type": "text", "items": [{"h": "改成疑問句", "q": "You are going to play tennis today.", "a": ["Are you going to play tennis today?"]}, {"h": "改成否定句", "q": "I'm going to go skateboarding.", "a": ["I'm not going to go skateboarding.", "I am not going to go skateboarding."]}, {"h": "主詞改成 She", "q": "I have a skateboard and a helmet.", "a": ["She has a skateboard and a helmet."]}, {"h": "改成疑問句", "q": "He has a bat.", "a": ["Does he have a bat?"]}, {"h": "改成否定句", "q": "We're going to play baseball.", "a": ["We're not going to play baseball.", "We are not going to play baseball.", "We aren't going to play baseball."]}]}, {"id": "reorder", "name": "七、句子重組", "desc": "依序點選單字，排成正確的句子。", "type": "order", "items": [{"w": ["What", "you", "to", "are", "going", "do?"], "a": ["What are you going to do?"]}, {"w": ["play", "He's", "going", "to", "baseball."], "a": ["He's going to play baseball."]}, {"w": ["has", "and", "a", "mitt.", "bat", "a", "He"], "a": ["He has a bat and a mitt."]}, {"w": ["I'm", "fishing.", "going", "go", "to"], "a": ["I'm going to go fishing."]}, {"w": ["I", "a", "helmet.", "and", "have", "a", "skateboard"], "a": ["I have a skateboard and a helmet."]}]}];const L='ABCDE';
const norm=t=>t.toLowerCase().replace(/[’']/g,"'").replace(/i'm/g,'i am').replace(/he's/g,'he is').replace(/she's/g,'she is').replace(/it's/g,'it is').replace(/we're/g,'we are').replace(/they're/g,'they are').replace(/you're/g,'you are').replace(/isn't/g,'is not').replace(/aren't/g,'are not').replace(/doesn't/g,'does not').replace(/don't/g,'do not').replace(/how's/g,'how is').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
let total=0,answered=0,score=0;const chk=[];
function say(t,n){speechSynthesis.cancel();const go=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)};go();}
const m=document.getElementById('m');
function upd(){document.getElementById('stat').textContent=`已作答 ${answered}/${total}　目前得分 ${Math.round(score/total*100)}`;document.getElementById('fill').style.width=answered/total*100+'%'}
function mark(el,ok,txt){el.querySelector('.fb')?.remove();const f=document.createElement('div');f.className='fb '+(ok?'ok':'bad');f.textContent=ok?'✅ 答對了':'❌ 正確答案：'+txt;el.appendChild(f)}
S.forEach(sec=>{
 m.insertAdjacentHTML('beforeend',`<h2>${sec.name}</h2><p class="desc">${sec.desc}</p>`+(sec.passage?`<div class="passage">${sec.passage}</div>`:''));
 if(sec.type==='match'){m.insertAdjacentHTML('beforeend','<div class="q">'+sec.opts.map((o,k)=>`<div>(${L[k]}) ${o}</div>`).join('')+'</div>')}
 sec.items.forEach((it,idx)=>{total++;const no=total;const d=document.createElement('div');d.className='q';let done=false;
  const fin=(ok,txt)=>{if(done)return;done=true;answered++;if(ok)score++;mark(d,ok,txt);upd()};
  d.insertAdjacentHTML('beforeend',`<div><b>${no}.</b> ${it.audio?'':(it.q||'')}${it.audio?it.q:''}</div>`);
  if(it.audio){const b=document.createElement('button');b.className='play';b.textContent='🔊 播放';b.onclick=()=>say(it.audio);d.prepend(b)}
  if(sec.type==='mc'||sec.type==='tf'){const opts=sec.type==='tf'?['True（對）','False（錯）']:it.o;const ai=sec.type==='tf'?(it.a?0:1):it.a;
   opts.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=(sec.type==='tf'?'':'('+L[k]+') ')+t;b.onclick=()=>{if(done)return;const ok=k===ai;b.classList.add(ok?'ok':'bad');if(!ok)d.querySelectorAll('.opt')[ai].classList.add('ok');fin(ok,opts[ai])};d.appendChild(b)});}
  if(sec.type==='match'){const s=document.createElement('select');s.innerHTML='<option value="">請選擇</option>'+sec.opts.map((o,k)=>`<option value="${k}">(${L[k]})</option>`).join('');s.onchange=()=>{if(done)return;const ok=+s.value===it.a;s.disabled=true;fin(ok,'('+L[it.a]+') '+sec.opts[it.a])};d.appendChild(s)}
  if(sec.type==='text'){d.firstChild.innerHTML=`<b>${no}.</b> （${it.h}）${it.q}`;const i=document.createElement('input');i.type='text';i.autocapitalize='off';i.placeholder='輸入完整句子';d.appendChild(i);const b=document.createElement('button');b.className='small';b.style.marginTop='8px';b.textContent='檢查';b.onclick=()=>{if(done||!i.value.trim())return;i.disabled=true;fin(it.a.map(norm).includes(norm(i.value)),it.a[0])};d.appendChild(b)}
  if(sec.type==='order'){d.firstChild.innerHTML=`<b>${no}.</b> 重組句子`;const ans=document.createElement('div');ans.className='ans';const pool=document.createElement('div');let picked=[];
   it.w.forEach(w=>{const c=document.createElement('button');c.className='chip';c.textContent=w;c.onclick=()=>{if(done||c.classList.contains('used'))return;c.classList.add('used');picked.push([w,c]);ans.textContent=picked.map(x=>x[0]).join(' ')};pool.appendChild(c)});
   const undo=document.createElement('button');undo.className='small';undo.textContent='↩ 退回';undo.onclick=()=>{if(done||!picked.length)return;picked.pop()[1].classList.remove('used');ans.textContent=picked.map(x=>x[0]).join(' ')};
   const ck=document.createElement('button');ck.className='small';ck.textContent='檢查';ck.onclick=()=>{if(done||picked.length<it.w.length)return;fin(it.a.map(norm).includes(norm(picked.map(x=>x[0]).join(' '))),it.a[0])};
   d.append(ans,pool,undo,ck)}
  m.appendChild(d)})});
upd();
document.getElementById('submit').onclick=()=>{const sc=Math.round(score/total*100);document.getElementById('sc').textContent=sc;document.getElementById('gl').textContent=answered<total?`還有 ${total-answered} 題沒作答（算 0 分）`:(sc>=90?'太棒了！':sc>=70?'不錯喔，再加油！':'再複習一次單字和句型吧！');document.getElementById('ov').style.display='flex'};
</script></body></html>
