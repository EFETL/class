<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>目前離線｜星光教學舞台</title>
<link rel="icon" href="/assets/img/logo.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  min-height:100vh;background:linear-gradient(150deg,#4c5fd5 0%,#3a49aa 55%,#8b5cf6 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;text-align:center;color:#fff;
}
.mark{width:88px;height:88px;border-radius:24px;margin-bottom:22px;
  box-shadow:0 14px 32px rgba(20,25,70,.38)}
h1{font-size:1.6rem;letter-spacing:1px;margin-bottom:14px;text-shadow:0 3px 14px rgba(20,25,70,.3)}
p{color:rgba(255,255,255,.92);line-height:2;max-width:23em;margin-bottom:30px;
  text-shadow:0 2px 10px rgba(20,25,70,.22)}
a.btn{display:inline-block;padding:14px 34px;border-radius:14px;background:#fff;
  color:#4c5fd5;text-decoration:none;font-weight:700;font-size:1.02rem;letter-spacing:1px;
  box-shadow:0 12px 28px rgba(20,25,70,.3);transition:transform .25s cubic-bezier(.4,0,.2,1)}
a.btn:hover{transform:scale(1.05)}
</style>
<!-- EFETL-PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4c5fd5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="星光舞台">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
<!-- /EFETL-PWA -->
</head>
<body>
<img class="mark" src="/icon-192.png" alt="星光教學舞台">
<h1>目前沒有網路連線</h1>
<p>已經打開過的題本和頁面仍然可以繼續看，<br>其他頁面請等連上網路後再試一次。</p>
<a class="btn" href="/" onclick="location.reload();return false;">重新載入</a>
</body>
</html>
